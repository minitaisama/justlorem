name: Purge justlorem.com cache

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Purge justlorem.com hostname only
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const headers = { Authorization: `Bearer ${process.env.CF_API_TOKEN}` };
          const domainsResponse = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/pages/projects/justlorem/domains`, { headers });
          const domains = await domainsResponse.json();
          if (!domainsResponse.ok || !domains.success) {
            console.error("Cloudflare Pages domain lookup failed:", domainsResponse.status, domains.errors);
            process.exit(1);
          }
          const matches = domains.result.filter((domain) => domain.name === "justlorem.com" && domain.zone_tag);
          if (matches.length !== 1) {
            console.error("Expected exactly one justlorem.com Pages domain with a zone tag; found", matches.length);
            process.exit(1);
          }
          const purgeResponse = await fetch(`https://api.cloudflare.com/client/v4/zones/${matches[0].zone_tag}/purge_cache`, {
            method: "POST",
            headers: { ...headers, "Content-Type": "application/json" },
            body: JSON.stringify({ hosts: ["justlorem.com"] }),
          });
          const purge = await purgeResponse.json();
          if (!purgeResponse.ok || !purge.success) {
            console.error("Cloudflare hostname purge failed:", purgeResponse.status, purge.errors);
            process.exit(1);
          }
          console.log("Purged cached responses for justlorem.com only.");
          NODE
